<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#111111"/>
  <!-- Minimalist Syntax Tree Graph -->
  <!-- Root Node -->
  <circle cx="32" cy="16" r="4.5" fill="#E30613"/>
  <!-- Main Branches -->
  <line x1="32" y1="16" x2="18" y2="34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="46" y2="34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- Left Node -->
  <circle cx="18" cy="34" r="4" fill="#FFFFFF"/>
  <!-- Right Sub-tree -->
  <circle cx="46" cy="34" r="4" fill="#FFFFFF"/>
  <line x1="46" y1="34" x2="38" y2="50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="34" x2="54" y2="50" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="50" r="3.2" fill="#FFFFFF"/>
  <circle cx="54" cy="50" r="3.2" fill="#FFFFFF"/>
</svg>
